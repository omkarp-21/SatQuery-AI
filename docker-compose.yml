services:
  api:
    build:
      context: ./backend
      dockerfile: ../infra/docker/backend.Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./models:/models
      - ./data:/data
    depends_on:
      - db
      - redis
      - minio

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/frontend.Dockerfile
    env_file: .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: satquery
      POSTGRES_PASSWORD: satquery
      POSTGRES_DB: satquery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx:/etc/nginx/conf.d:ro
    ports:
      - "8080:80"
    depends_on:
      - api
      - frontend
    profiles: ["prod"]

volumes:
  pgdata:
  miniodata:
