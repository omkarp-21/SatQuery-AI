[project]
name = "satquery-geospatial"
version = "0.1.0"
description = "SatQuery geospatial engine — raster/vector I/O, reprojection, co-registration, area computation."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9",
    "numpy>=1.26",
    "rasterio>=1.4",
    "shapely>=2.0",
    "pyproj>=3.7",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "black>=24.10", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satquery_geospatial"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
