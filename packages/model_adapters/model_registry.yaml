# SatQuery model registry.
# Routing reads ONLY this file (never hardcoded model names). Every entry records
# MEASURED facts from G1–G2.5 runtime validation, not paper claims. Evidence
# levels: documented < reproduced < measured < integrated < validated
# (see docs/research/EVIDENCE_LEDGER.md).
#
# Each entry maps to an adapter class in src/satquery_model_adapters/ (ADAPTERS dict).

version: 2
updated: 2026-09-01

models:

  remoteclip:
    adapter: satquery_model_adapters.remoteclip:RemoteClipAdapter
    source_repo: https://github.com/ChenDelong1999/RemoteCLIP
    paper: "RemoteCLIP: A Vision Language Foundation Model for Remote Sensing (IEEE TGRS 2024)"
    commit: a6a4787507e441f444c20404c90dd18520a8960d
    license: Apache-2.0
    capabilities: [zero-shot-classification, retrieval, embedding]
    modalities: [optical-single]
    input: "1 RGB image + ';'-separated candidate labels"
    output: "ranked labels + softmax over the given prompts (relative score, not calibrated)"
    environment: ".venvs/remoteclip (open-clip-torch 3.3.0, torch 2.13 cpu)"
    checkpoint: "models/cache/remoteclip/RemoteCLIP-ViT-B-32.pt (605,208,421 B)"
    hardware: "CPU ok; ~0.6 GB weights; fits 4 GB GPU trivially"
    quantization: "not needed (fp32 CPU fits)"
    latency: "~150 ms/query (CPU, warm, 1 img + ~4 prompts)"
    memory: "~1.6 GB RSS (CPU)"
    params: "151.3 M"
    benchmark: "authors: RSITMD/RSICD retrieval SOTA-class (2024) — NOT reproduced by us"
    our_measured_result: "official example correct (airport 97.8% top-1, n=1); latency ~150 ms — reproduction, not a benchmark"
    evidence_level: integrated   # runs via RemoteClipAdapter + /scene, with provenance
    status: KEEP
    fallback: "none (auxiliary; not on the mandatory-capability critical path)"
    note: "NOT a VQA model. Retrieval / zero-shot / embedding index only."

  changeformer:
    adapter: satquery_model_adapters.changeformer:ChangeFormerAdapter
    source_repo: https://github.com/wgcban/ChangeFormer
    paper: "A Transformer-Based Siamese Network for Change Detection (IGARSS 2022)"
    commit: afd1b7ed640aa265a2c730de958416ae7356a2f9
    license: MIT
    capabilities: [change-detection]
    modalities: [optical-bitemporal]
    input: "2 co-registered RGB rasters (T1, T2), identical dims"
    output: "binary change mask PNG + {changed_fraction, changed_pixels, total_pixels}"
    environment: ".venvs/changeformer (torch 2.5.1 cpu, numpy 1.23.5, opencv/tifffile) — no source edits"
    checkpoint: "models/cache/changeformer/CD_ChangeFormerV6_LEVIR_.../best_ckpt.pt (492 MB)"
    hardware: "CPU ok; ~1 GB RAM; <0.6 GB VRAM on GPU"
    quantization: "not needed (41 M params, fp32 CPU)"
    latency: "~790 ms / 256^2 pair (CPU)"
    memory: "~1.0 GB RSS (CPU)"
    params: "41.0 M"
    benchmark: "authors (checkpoint log.txt): overall acc 0.9495 on LEVIR-CD test — their number, NOT ours"
    our_measured_result: "change-IoU 0.832 / F1 0.908 on 7 bundled LEVIR-CD samples (n=7, CPU, 2026-09-01) — reproduction, NOT a benchmark; integrated: /change changed_fraction 0.2526 on the demo pair"
    evidence_level: integrated   # runs in the temporal slice via subprocess adapter, with provenance
    status: KEEP
    fallback: "image-difference + threshold (trivial baseline) if the adapter env is unavailable"
    note: "Mask only — no semantic classes, no language, no SAR. score = coverage, NOT a confidence."

  croma:
    adapter: satquery_model_adapters.croma:CromaAdapter
    source_repo: https://github.com/antofuller/CROMA
    paper: "CROMA: Remote Sensing Representations with Contrastive Radar-Optical Masked Autoencoders (NeurIPS 2023)"
    commit: 59505a6bcadbf36ba20767270154bf9f3067c5e7
    license: MIT
    capabilities: [embedding, representation]
    modalities: [optical-sar]
    input: "paired Sentinel-1 (2ch) + Sentinel-2 (12ch), 120x120, saved as .npy"
    output: "joint_gap / optical_gap / sar_gap feature vectors (dim 768); no score"
    environment: ".venvs/croma (torch 2.13 cpu, einops)"
    checkpoint: "models/cache/croma/CROMA_base.pt (777,563,846 B)"
    hardware: "CPU ok; ~1.1-1.8 GB RSS; fits 4 GB GPU"
    quantization: "not needed (194 M, fp32 CPU)"
    latency: "~340 ms/sample (joint forward, CPU)"
    memory: "~1.1-1.8 GB RSS (CPU)"
    params: "194.4 M"
    benchmark: "authors: SOTA-class linear-probe on BigEarthNet / DFC2020 (2023) — NOT reproduced by us"
    our_measured_result: "official example reproduced (joint SAR+optical embeddings, shapes+finite); EXP-004 Run 1 synthetic control: SAR-only signal recovered 1.00 vs optical-only 0.49 — SANITY, not a benchmark"
    evidence_level: reproduced   # official example; probe machinery validated on synthetic control (EXP-004 Run 1)
    status: KEEP FOR TOURNAMENT   # primary optical-SAR candidate; adopt pending EXP-004 Run 2
    fallback: "dofa (the other optical-SAR encoder) - decide in EXP-004 Run 2"
    note: "Representations only — needs a downstream head. Native joint radar-optical encoder."

  dofa:
    adapter: satquery_model_adapters.dofa:DofaAdapter
    source_repo: https://github.com/zhu-xlab/DOFA
    paper: "Neural Plasticity-Inspired Multimodal Foundation Model for Earth Observation (DOFA, 2024)"
    commit: 0cfb7e1099f4d4c4022946ff7862c7cd7b8411b9
    license: MIT
    capabilities: [embedding, representation]
    modalities: [optical-single, sar-single]
    input: "one modality tensor (S1 2ch or S2 12ch), .npy; wavelength list is fixed per modality"
    output: "global feature vector (dim 768); no score. Fuse S2 + S1 downstream."
    environment: ".venvs/dofa (torch 2.13 cpu, timm==0.9.2)"
    checkpoint: "models/cache/dofa/DOFA_ViT_base_e100.pth (447,669,164 B)"
    hardware: "CPU ok; ~1.3 GB RSS; fits 4 GB GPU"
    quantization: "not needed (111 M, fp32 CPU)"
    latency: "~120 ms/sample (CPU)"
    memory: "~1.3 GB RSS (CPU)"
    params: "111.3 M"
    benchmark: "authors: competitive with sensor-specific FMs on GEO-Bench (2024) — NOT reproduced by us"
    our_measured_result: "forward_features reproduced for S1 (2ch) + S2 (12ch), finite (B,768); EXP-004 Run 1 synthetic: S2+S1 fused recovers SAR signal 1.00 vs optical-only 0.50 — SANITY"
    evidence_level: reproduced
    status: KEEP FOR TOURNAMENT   # CROMA challenger; decide in EXP-004 Run 2
    fallback: "croma"
    note: "One wavelength-conditioned encoder for any sensor; fusion is a downstream choice."

# --- not in the registry: no runnable adapter (blocked / rejected) ---
# Statuses + measured facts only. NO capability is claimed here for an unrun model.
# Single-image candidate set revised by the Lightweight Model Replacement Audit
# (2026-09-01) — see docs/research/LIGHTWEIGHT_AUDIT.md + EXP-002.md.
excluded:
  geochat:      { status: TEST FURTHER, reason: "reference ceiling — 7B > 4 GB VRAM; deepspeed/bnb unbuildable on Windows; needs remote GPU >=16 GB" }
  change_agent: { status: TEST FURTHER, reason: "mmcv==1.3.1 unbuildable; Linux+conda only" }
  changechat:   { status: REJECT, reason: "no released weights; README now cites >=48 GB VRAM to train" }
  rs_moe:       { status: REJECT, reason: "no released checkpoints, no inference script, no license" }
  tinyrs:       { status: TEST FURTHER, reason: "EXP-002 fallback arm — 2B, Apache-2.0, HF aybora/Qwen2-VL-TinyRS; weight download BLOCKED from this host (5 attempts, <1 MB/s)" }
  rscovlm:      { status: TEST FURTHER, reason: "EXP-002 PRIMARY arm — Qwen2.5-VL-3B, MIT code / CC-BY-4.0 data, HF Qingyun/rscovlm; RS multi-task VQA+grounding+caption; 4 GB only at 4-bit (undocumented); DOCUMENTED, repro pending" }
  earthdial_4b: { status: TEST FURTHER (remote), reason: "InternVL2+Phi-3-Mini 4B, MIT code+weights, HF akshaydudhane/EarthDial_4B_*; adds SAR + temporal + grounding + captioning; too heavy for 4 GB fp16 -> remote box; DOCUMENTED only" }
  qwen2_vl_2b:  { status: CONTROL, reason: "generic-VLM baseline for EXP-001/002 — Qwen/Qwen2-VL-2B-Instruct, Apache-2.0, native bbox grounding; NOT an RS specialist" }
  skyeyegpt:    { status: BLOCKED, reason: "~7B MiniGPT-v2/LLaMA-2; released weights but NO inference recipe (README 'coming soon'); license not stated" }
  isro_geonli:  { status: REJECT, reason: "not a model — FastAPI wrapper over Qwen3-VL + SAM3; README recommends 36 GB+ VRAM; no own checkpoint" }

routing:
  # rule-over-registry: modality + task -> allowed adapters. No LLM here.
  # Deterministic rules + tests: packages/core/src/satquery_core/routing/, docs/research/ROUTING_SPEC.md
  # Called by POST /analyze (G4).
  bitemporal_change_mask: [changeformer]
  single_image_scene_or_retrieval: [remoteclip]
  optical_sar_representation: [croma, dofa]   # bake-off BLOCKED (EXP-004 Run 2 - no dataset)
  single_image_vqa: []             # unresolved - EXP-002 BLOCKED (weights unfetchable); -> NO_VQA_SPECIALIST
  single_image_grounding: []       # unresolved - EXP-002
  bitemporal_semantic_change:      # composed baseline only (NOT learned / NOT validated)
    composed_baseline: [changeformer, remoteclip]   # COMPOSED_SEMANTIC_CHANGE_BASELINE
    learned_model: []              # unresolved - EXP-003 (needs a remote box)
