[project]
name = "satquery-model-adapters"
version = "0.1.0"
description = "SatQuery specialist model adapters and the model registry. Product-safe: no research-repo imports."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "black>=24.10", "mypy>=1.13"]
ml = ["torch>=2.5", "open-clip-torch>=2.29"]  # heavy; installed only where a model runs

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satquery_model_adapters"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
