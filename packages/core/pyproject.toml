[project]
name = "satquery-core"
version = "0.1.0"
description = "SatQuery pipeline spine — ingestion, metadata, routing, planning, registry, fusion, confidence, reports; shared typed contracts."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "black>=24.10", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satquery_core"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
